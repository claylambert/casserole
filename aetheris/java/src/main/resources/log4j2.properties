status = error
name = CasseroleServer

appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c{1} - %m%n

appender.file.type = RollingFile
appender.file.name = File
appender.file.fileName = ${sys:user.home}/.casserole/logs/casserole.log
appender.file.filePattern = ${sys:user.home}/.casserole/logs/casserole-%d{yyyy-MM-dd}.log.gz
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c - %m%n
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.time.interval = 1

rootLogger.level = info
rootLogger.appenderRefs = console, file
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.file.ref = File

logger.casserole.name = org.casserole
logger.casserole.level = info
logger.roux.name = org.roux
logger.roux.level = info
logger.sshd.name = org.apache.sshd
logger.sshd.level = warn
